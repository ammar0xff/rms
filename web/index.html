<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="PIE POS & Restaurant Operations System">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PIE">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PIE Operations</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      background-color: #0F1117;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    #pie-print-mount {
      display: none !important;
    }

    @media print {
      body > *:not(#pie-print-mount) {
        display: none !important;
      }
      flutter-view, flt-glass-pane, flt-scene, flt-semantics-host {
        display: none !important;
      }

      html, body {
        background: #ffffff !important;
        background-color: #ffffff !important;
        color: #000000 !important;
        margin: 0 !important;
        padding: 0 !important;
        height: auto !important;
        min-height: 0 !important;
        overflow: visible !important;
      }

      @page {
        margin: 0;
        size: 80mm auto;
      }

      #pie-print-mount {
        display: block !important;
        position: static !important;
        width: 72mm !important;
        max-width: 100% !important;
        margin: 0 auto !important;
        padding: 4mm 2mm !important;
        background: #ffffff !important;
        color: #000000 !important;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Cairo", "Arial", sans-serif !important;
        font-size: 12px !important;
        line-height: 1.35 !important;
        direction: rtl !important;
        box-sizing: border-box !important;
      }

      #pie-print-mount * {
        color: #000000 !important;
        box-sizing: border-box !important;
      }
    }

    #pie-web-splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #0F1117;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Cairo", "Arial", sans-serif;
      transition: opacity 0.45s ease, visibility 0.45s ease;
      color: #FFFFFF;
      user-select: none;
    }
    #pie-web-splash.pie-fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .pie-splash-logo {
      width: 88px;
      height: 88px;
      border-radius: 24px;
      background: #181B23;
      border: 2px solid #E11D48;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 50px;
      font-weight: 800;
      color: #E11D48;
      box-shadow: 0 0 35px rgba(225, 29, 72, 0.35);
      animation: piePulse 2s ease-in-out infinite;
    }
    @keyframes piePulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 35px rgba(225, 29, 72, 0.35); }
      50% { transform: scale(1.05); box-shadow: 0 0 55px rgba(225, 29, 72, 0.6); }
    }
    .pie-splash-title {
      font-size: 24px;
      font-weight: 700;
      margin-top: 22px;
      letter-spacing: 1.5px;
      color: #F8FAFC;
    }
    .pie-splash-subtitle {
      font-size: 13px;
      color: #94A3B8;
      margin-top: 6px;
      direction: rtl;
    }
    .pie-splash-loader {
      margin-top: 32px;
      width: 40px;
      height: 40px;
      border: 3px solid rgba(225, 29, 72, 0.15);
      border-top-color: #E11D48;
      border-radius: 50%;
      animation: pieSpin 0.85s linear infinite;
    }
    @keyframes pieSpin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="pie-web-splash">
    <div class="pie-splash-logo">π</div>
    <div class="pie-splash-title">PIE OPERATIONS</div>
    <div class="pie-splash-subtitle">نظام تشغيل وإدارة المطاعم الميداني</div>
    <div class="pie-splash-loader"></div>
  </div>
  <div id="pie-print-mount"></div>
  <script>
    (function() {
      // Dismiss HTML splash when Flutter renders first frame
      window.hidePieWebSplash = function() {
        var splash = document.getElementById('pie-web-splash');
        if (splash) {
          splash.classList.add('pie-fade-out');
          setTimeout(function() {
            if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
          }, 500);
        }
      };
      window.addEventListener('flutter-first-frame', window.hidePieWebSplash);
      // 1. Hardware capability probe for WebGL2 Skia shaders and stencil buffers
      function testWebGL2Capability() {
        try {
          var testCanvas = document.createElement('canvas');
          testCanvas.width = 16;
          testCanvas.height = 16;
          var gl = testCanvas.getContext('webgl2', { stencil: true, depth: true, antialias: false });
          if (!gl) return false;

          // Verify GLSL 3.0 ES vertex compilation
          var vs = gl.createShader(gl.VERTEX_SHADER);
          gl.shaderSource(vs, '#version 300 es\nin vec4 pos;\nvoid main() { gl_Position = pos; }');
          gl.compileShader(vs);
          if (!gl.getShaderParameter(vs, gl.COMPILE_STATUS)) return false;

          // Verify Skia GLSL 3.0 ES fragment compilation with texture bias and sk_FragColor
          var fs = gl.createShader(gl.FRAGMENT_SHADER);
          gl.shaderSource(fs, '#version 300 es\nprecision mediump float;\nprecision mediump sampler2D;\nout mediump vec4 sk_FragColor;\nuniform sampler2D uSampler;\nin highp vec2 vTex;\nvoid main() { sk_FragColor = texture(uSampler, vTex, -0.475); }');
          gl.compileShader(fs);
          if (!gl.getShaderParameter(fs, gl.COMPILE_STATUS)) return false;

          // Verify program link
          var prog = gl.createProgram();
          gl.attachShader(prog, vs);
          gl.attachShader(prog, fs);
          gl.linkProgram(prog);
          if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return false;

          // Verify stencil buffer attachment in framebuffer
          var fb = gl.createFramebuffer();
          gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
          var rb = gl.createRenderbuffer();
          gl.bindRenderbuffer(gl.RENDERBUFFER, rb);
          gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH24_STENCIL8, 16, 16);
          gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_STENCIL_ATTACHMENT, gl.RENDERBUFFER, rb);
          var status = gl.checkFramebufferStatus(gl.FRAMEBUFFER);
          if (status !== gl.FRAMEBUFFER_COMPLETE) return false;

          // Cleanup test WebGL objects
          gl.deleteFramebuffer(fb);
          gl.deleteRenderbuffer(rb);
          gl.deleteProgram(prog);
          gl.deleteShader(vs);
          gl.deleteShader(fs);

          var loseExt = gl.getExtension('WEBGL_lose_context');
          if (loseExt) loseExt.loseContext();

          return true;
        } catch (e) {
          return false;
        }
      }

      var forceWebGL1 = window.location.search.indexOf('webgl=1') !== -1 ||
                        window.location.search.indexOf('gl=1') !== -1 ||
                        sessionStorage.getItem('pie_webgl_mode') === 'webgl1';

      var webGL2Safe = !forceWebGL1 && testWebGL2Capability();

      if (!webGL2Safe) {
        console.warn('[PIE Graphics Engine] WebGL2 shader/stencil is incompatible with current GPU/driver. Activating rock-solid WebGL 1 fallback mode.');
        sessionStorage.setItem('pie_webgl_mode', 'webgl1');

        try {
          delete window.WebGL2RenderingContext;
        } catch (_) {
          window.WebGL2RenderingContext = undefined;
        }

        var origCanvasGetContext = HTMLCanvasElement.prototype.getContext;
        HTMLCanvasElement.prototype.getContext = function(type, attributes) {
          if (type === 'webgl2') {
            return null;
          }
          if (type === 'webgl' || type === 'experimental-webgl') {
            attributes = attributes || {};
            attributes.stencil = true;
            attributes.depth = true;
          }
          return origCanvasGetContext.call(this, type, attributes);
        };

        if (typeof OffscreenCanvas !== 'undefined') {
          var origOffscreenGetContext = OffscreenCanvas.prototype.getContext;
          OffscreenCanvas.prototype.getContext = function(type, attributes) {
            if (type === 'webgl2') {
              return null;
            }
            if (type === 'webgl' || type === 'experimental-webgl') {
              attributes = attributes || {};
              attributes.stencil = true;
              attributes.depth = true;
            }
            return origOffscreenGetContext.call(this, type, attributes);
          };
        }
      } else {
        console.info('[PIE Graphics Engine] WebGL2 hardware verification passed.');
      }

      // Auto-recover if WebGL context is lost unexpectedly
      window.addEventListener('webglcontextlost', function(event) {
        console.warn('[PIE Graphics Engine] WebGL Context Lost encountered.', event);
        var losses = parseInt(sessionStorage.getItem('pie_webgl_losses') || '0', 10) + 1;
        sessionStorage.setItem('pie_webgl_losses', losses.toString());
        if (losses >= 1 && sessionStorage.getItem('pie_webgl_mode') !== 'webgl1') {
          console.warn('[PIE Graphics Engine] Fallback to WebGL 1 scheduled for recovery.');
          sessionStorage.setItem('pie_webgl_mode', 'webgl1');
          setTimeout(function() {
            window.location.reload();
          }, 150);
        }
      }, true);

      // Cross-platform Web Receipt Printer via @media print isolation
      window.piePrintReceiptHtml = function(htmlContent) {
        try {
          var mount = document.getElementById('pie-print-mount');
          if (!mount) {
            mount = document.createElement('div');
            mount.id = 'pie-print-mount';
            document.body.appendChild(mount);
          }

          var cleanHtml = htmlContent;
          var bodyMatch = htmlContent.match(/<body[^>]*>([\s\S]*)<\/body>/i);
          if (bodyMatch) {
            cleanHtml = bodyMatch[1];
          }
          var styleMatch = htmlContent.match(/<style[^>]*>([\s\S]*)<\/style>/i);
          var styles = styleMatch ? styleMatch[0] : '';

          mount.innerHTML = styles + '<div class="receipt-print-wrapper" dir="rtl">' + cleanHtml + '</div>';

          // Clean up only after print dialog closes, never with premature timer
          var cleanup = function() {
            window.removeEventListener('afterprint', cleanup);
            var m = document.getElementById('pie-print-mount');
            if (m) m.innerHTML = '';
          };
          window.addEventListener('afterprint', cleanup);

          // Trigger print directly on top-level window (100% supported on desktop & mobile)
          window.print();
          return true;
        } catch (e) {
          console.error('[PIE Printer] Print error:', e);
          return false;
        }
      };

      // Direct new tab receipt opener via Blob URL for popup / standalone printing
      window.pieOpenReceiptTab = function(htmlContent) {
        try {
          var blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
          var blobUrl = URL.createObjectURL(blob);
          var w = window.open(blobUrl, '_blank');
          if (w) {
            w.focus();
            return true;
          }
        } catch (e) {
          console.warn('[PIE Printer] Open receipt tab error:', e);
        }
        return false;
      };

      // POS Sound Effects Engine via Web Audio API Synthesis
      window.piePlaySound = function(type) {
        try {
          var AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return false;
          if (!window._pieAudioCtx) {
            window._pieAudioCtx = new AudioCtx();
          }
          var ctx = window._pieAudioCtx;
          if (ctx.state === 'suspended') {
            ctx.resume();
          }
          var now = ctx.currentTime;
          
          if (type === 'click') {
            var osc = ctx.createOscillator();
            var gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, now);
            osc.frequency.exponentialRampToValueAtTime(350, now + 0.035);
            gain.gain.setValueAtTime(0.12, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.035);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.035);
            return true;
          }
          if (type === 'pop') {
            var osc = ctx.createOscillator();
            var gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(500, now);
            osc.frequency.exponentialRampToValueAtTime(850, now + 0.05);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.05);
            return true;
          }
          if (type === 'beep') { // POS item scan / add to cart
            var osc = ctx.createOscillator();
            var gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(1350, now);
            gain.gain.setValueAtTime(0.18, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.07);
            return true;
          }
          if (type === 'chime') { // Cash drawer / Payment / Checkout success
            var freqs = [523.25, 659.25, 783.99, 1046.50];
            freqs.forEach(function(freq, idx) {
              var t = now + idx * 0.06;
              var osc = ctx.createOscillator();
              var gain = ctx.createGain();
              osc.type = 'triangle';
              osc.frequency.setValueAtTime(freq, t);
              gain.gain.setValueAtTime(0.15, t);
              gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(t);
              osc.stop(t + 0.42);
            });
            return true;
          }
          if (type === 'alert') { // Warning / Void / Rejection
            var alertFreqs = [320, 240];
            alertFreqs.forEach(function(freq, idx) {
              var t = now + idx * 0.12;
              var osc = ctx.createOscillator();
              var gain = ctx.createGain();
              osc.type = 'sawtooth';
              osc.frequency.setValueAtTime(freq, t);
              gain.gain.setValueAtTime(0.15, t);
              gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(t);
              osc.stop(t + 0.11);
            });
            return true;
          }
          return false;
        } catch (e) {
          return false;
        }
      };
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
