<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="PIE POS & Restaurant Operations System">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PIE">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PIE Operations</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      background-color: #0F1117 !important;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
  </style>
</head>
<body style="background-color: #0F1117;">
  <!-- WebGL Context Loss & Recovery Guard -->
  <script>
    (function() {
      var contextLossCount = 0;
      var lastLossTime = 0;

      // Intercept WebGL context loss at the window capture phase to call preventDefault
      // This tells the browser NOT to destroy the WebGL context permanently, allowing Skia/CanvasKit to restore.
      window.addEventListener('webglcontextlost', function(event) {
        event.preventDefault();
        var now = Date.now();
        if (now - lastLossTime < 10000) {
          contextLossCount++;
        } else {
          contextLossCount = 1;
        }
        lastLossTime = now;
        console.warn('[PIE Graphics] WebGL context lost (count: ' + contextLossCount + '). Handled gracefully with preventDefault.');

        if (contextLossCount >= 4) {
          var notice = document.getElementById('pie-webgl-recovery');
          if (!notice) {
            notice = document.createElement('div');
            notice.id = 'pie-webgl-recovery';
            notice.style.position = 'fixed';
            notice.style.bottom = '16px';
            notice.style.left = '50%';
            notice.style.transform = 'translateX(-50%)';
            notice.style.background = '#1A1D24';
            notice.style.color = '#F3F4F6';
            notice.style.border = '1px solid #DC2626';
            notice.style.borderRadius = '8px';
            notice.style.padding = '12px 20px';
            notice.style.zIndex = '999999';
            notice.style.fontFamily = 'system-ui, sans-serif';
            notice.style.direction = 'rtl';
            notice.style.boxShadow = '0 10px 25px rgba(0,0,0,0.5)';
            notice.innerHTML = '<span style="font-weight:600">تنبيه بالرسومات:</span> واجه متصفحك ضغطاً في معالج الرسوميات (GPU). ' +
              '<button onclick="window.location.reload()" style="margin-right:12px;background:#E5A93C;color:#090A0E;border:none;padding:6px 14px;border-radius:4px;cursor:pointer;font-weight:600">إعادة التحميل</button>';
            document.body.appendChild(notice);
          }
        }
      }, true);

      window.addEventListener('webglcontextrestored', function(event) {
        console.info('[PIE Graphics] WebGL context successfully restored.');
        var notice = document.getElementById('pie-webgl-recovery');
        if (notice) notice.remove();
      }, true);
    })();
  </script>

  <script src="flutter_bootstrap.js?v=2.0.2" async></script>
</body>
</html>
