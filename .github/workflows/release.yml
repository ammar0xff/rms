name: Release

# Workflow B: build the current repository and publish it as the new version.
#
# Unlike the web deploy, this does not run on every push. Publishing is a
# deliberate act — it changes what every enrolled device is offered. The
# device tracks GitHub Releases directly (manifest.<platform>.json asset),
# so the release page is the whole update backend. The Firestore manifest
# write stays during the transition so pre-0.14.0 clients keep updating.
#
# The equivalent of "upload a ready APK/EXE" is the same publisher invoked
# with --reference, which skips the upload and writes only the manifests.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Target platform
        type: choice
        options: [android, windows, linux, macos]
        default: android
      version:
        description: Human version, e.g. 0.9.0
        type: string
        required: true
      channel:
        type: choice
        options: [production, beta, development]
        default: production
      severity:
        type: choice
        options: [optional, recommended, mandatory]
        default: recommended
      rollout:
        description: Percentage of devices offered the release (1-100)
        type: string
        default: '100'
      release-notes:
        type: string
        default: ''
      min-supported:
        description: Oldest version allowed to run this release
        type: string
        default: '0.0.0'
      rollback-target:
        description: Version to fall back to, if this release is bad
        type: string
        default: ''

permissions:
  # Creating a GitHub Release and uploading its asset needs write access.
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check required secrets
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SERVICE_ACCOUNT" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT is not configured."
            echo "Create a Firebase service account with Storage and Firestore"
            echo "write access, then add its JSON as a repository secret."
            exit 1
          fi

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Set up release signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "No signing key configured — building with the debug key."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 --decode > android/app/rms-release.keystore
          printf '%s\n' \
            "storePassword=$STORE_PASSWORD" \
            "keyPassword=$KEY_PASSWORD" \
            "keyAlias=$KEY_ALIAS" \
            "storeFile=rms-release.keystore" > android/key.properties

      - name: Install publisher dependencies
        run: npm install --no-save firebase-admin

      - name: Build artifact
        env:
          PLATFORM: ${{ inputs.platform }}
          VERSION: ${{ inputs.version }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          set -euo pipefail
          # Without these defines FirebaseConfig reads empty, the app boots in
          # demo mode (fake auth, no sync engine), and every signed release
          # since v0.9.0 has shipped that way. Same set the web deploy passes.
          defines=(
            --dart-define=APP_ENV=prod
            --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY"
            --dart-define=FIREBASE_AUTH_DOMAIN="$FIREBASE_AUTH_DOMAIN"
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID"
            --dart-define=FIREBASE_STORAGE_BUCKET="$FIREBASE_STORAGE_BUCKET"
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID"
            --dart-define=FIREBASE_APP_ID="$FIREBASE_APP_ID"
          )
          case "$PLATFORM" in
            android)
              flutter build apk --release \
                "${defines[@]}" \
                --build-name="$VERSION" \
                --build-number="${GITHUB_RUN_NUMBER}"
              echo "ARTIFACT=build/app/outputs/flutter-apk/app-release.apk" >> "$GITHUB_ENV"
              ;;
            linux)
              sudo apt-get update
              sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
              flutter build linux --release "${defines[@]}" --build-name="$VERSION"
              tar -czf build/rms-linux.tar.gz -C build/linux/x64/release/bundle .
              echo "ARTIFACT=build/rms-linux.tar.gz" >> "$GITHUB_ENV"
              ;;
            windows|macos)
              echo "::error::$PLATFORM cannot be built on a Linux runner."
              echo "Run this workflow on a native runner, or add a per-OS job."
              exit 1
              ;;
          esac

      # Artifacts are hosted on GitHub Releases rather than Cloud Storage, which
      # would need a Blaze billing account. The release is created here and the
      # manifest is written from its download URL.
      - name: Publish artifact to a GitHub Release
        id: asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.release-notes }}
        run: |
          set -euo pipefail
          NAME=$(basename "$ARTIFACT")
          TAG="v${VERSION}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists — replacing the asset."
            gh release upload "$TAG" "$ARTIFACT" --clobber
          else
            gh release create "$TAG" "$ARTIFACT" \
              --title "$TAG" \
              --notes "${RELEASE_NOTES:-Automated release.}"
          fi

          URL=$(gh release view "$TAG" --json assets \
            --jq ".assets[] | select(.name == \"$NAME\") | .url")
          if [ -z "$URL" ]; then
            echo "::error::could not resolve the download URL for $NAME"
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Hash the artifact
        id: digest
        run: |
          echo "sha=$(sha256sum "$ARTIFACT" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c%s "$ARTIFACT")" >> "$GITHUB_OUTPUT"

      - name: Publish artifact and manifest
        env:
          NODE_ENV: production
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          TAG="v${{ inputs.version }}"
          node tool/publish_release.mjs \
            --reference "${{ steps.asset.outputs.url }}" \
            --sha256 "${{ steps.digest.outputs.sha }}" \
            --size "${{ steps.digest.outputs.size }}" \
            --build-number "${GITHUB_RUN_NUMBER}" \
            --platform "${{ inputs.platform }}" \
            --version "${{ inputs.version }}" \
            --channel "${{ inputs.channel }}" \
            --severity "${{ inputs.severity }}" \
            --rollout "${{ inputs.rollout }}" \
            --release-notes "${{ inputs.release-notes }}" \
            --min-supported "${{ inputs.min-supported }}" \
            --rollback-target "${{ inputs.rollback-target }}"
          # The device tracks GitHub Releases, not Firestore: this asset is
          # the update backend. The Firestore write above stays during the
          # transition so pre-0.14.0 clients keep updating.
          gh release upload "$TAG" "manifest.${{ inputs.platform }}.json" --clobber

      - name: Keep the artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ inputs.platform }}-${{ inputs.version }}
          path: ${{ env.ARTIFACT }}
          retention-days: 30

      - name: Summary
        run: |
          {
            echo "### Release published"
            echo ""
            echo "- Platform: \`${{ inputs.platform }}\`"
            echo "- Version: \`${{ inputs.version }}\`"
            echo "- Channel: \`${{ inputs.channel }}\`"
            echo "- Severity: \`${{ inputs.severity }}\`"
            echo "- Rollout: ${{ inputs.rollout }}%"
            echo "- Artifact: \`$ARTIFACT\`"
          } >> "$GITHUB_STEP_SUMMARY"