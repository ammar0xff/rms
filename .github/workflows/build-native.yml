name: Build native artifacts

# Builds the Android APK and the Linux desktop bundle on every push.
#
# These are unsigned builds. Release signing is wired through the secrets below
# and falls back to the debug key when they are absent, so the pipeline works
# before signing keys exist but cannot ship a real update until they do.
#
# Building here is what proves the app is genuinely multi-platform: the web
# deploy cannot catch an Android manifest or Gradle problem.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-build
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rms-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  linux:
    name: Linux desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Required by the GTK toolchain that flutter build linux links against.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libstdc++-12-dev

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux bundle
        run: flutter build linux --release

      - name: Upload Linux bundle
        uses: actions/upload-artifact@v4
        with:
          name: rms-linux
          path: |
            build/linux/x64/release/bundle
            build/linux/x64/release/bundle.tar.gz
          retention-days: 14