name: Build native artifacts

# Builds every desktop and mobile target on every push.
#
# These are unsigned builds. Release signing is wired through the secrets below
# and falls back to the debug key when they are absent, so the pipeline works
# before signing keys exist but cannot ship a real update until they do.
#
# Building here is what proves the app is genuinely multi-platform: the web
# deploy cannot catch an Android manifest or Gradle problem.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-build
  cancel-in-progress: true

jobs:
  windows:
    name: Windows desktop
    # Windows needs the MSVC toolchain and cannot cross-compile from Linux, so
    # this requires a Windows runner. Nothing about the Windows target is
    # verified until this job has actually run.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows bundle
        run: flutter build windows --release

      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: rms-windows
          path: build/windows/x64/runner/Release
          retention-days: 14

  macos:
    name: macOS desktop
    # Unsigned: distribution needs an Apple Developer identity that does not
    # exist yet. The build still proves the target compiles and links.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS bundle
        # Unsigned. Flutter 3.47 has no --no-codesign flag, so the signing
        # identity is cleared in the build config instead. This is applied to
        # the runner's working copy only, so the repository keeps the real
        # signing configuration for when an Apple Developer identity exists.
        run: |
          cat >> macos/Runner/Configs/AppInfo.xcconfig <<'EOF'
          CODE_SIGN_IDENTITY = ""
          CODE_SIGNING_REQUIRED = NO
          CODE_SIGNING_ALLOWED = NO
          EOF
          flutter build macos --release

      - name: Upload macOS bundle
        uses: actions/upload-artifact@v4
        with:
          name: rms-macos
          path: build/macos/Build/Products/Release/rms.app
          retention-days: 14

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: flutter pub get

      # Skipped until the signing secrets exist. Once they do, the build is
      # signed for real; until then it falls back to the debug key so this job
      # still proves the app compiles.
      - name: Set up release signing
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > android/app/rms-release.keystore
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=rms-release.keystore
          EOF

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rms-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  linux:
    name: Linux desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Required by the GTK toolchain that flutter build linux links against.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libstdc++-12-dev

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux bundle
        run: flutter build linux --release

      - name: Upload Linux bundle
        uses: actions/upload-artifact@v4
        with:
          name: rms-linux
          path: |
            build/linux/x64/release/bundle
            build/linux/x64/release/bundle.tar.gz
          retention-days: 14