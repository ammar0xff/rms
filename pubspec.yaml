name: rms
description: Cross-platform Restaurant Management System (offline-first Flutter + Firebase).
publish_to: "none"
version: 0.18.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  connectivity_plus: ^7.3.2
  uuid: ^4.6.0
  sembast: ^3.8.11
  sembast_web: ^2.4.6
  path: ^1.9.1
  path_provider: ^2.1.6
  crypto: ^3.0.6
  http: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
